<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        background-color: #1e1e1e;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
        color: #4caf50;
        font-size: 2rem;
      }

      p {
        margin-top: 0.5rem;
        font-size: 0.875rem;
      }

      p a {
        color: #4caf50;
        text-decoration: none;
      }

      p a:hover {
        text-decoration: underline;
      }

      form {
        display: flex;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      input {
        flex: 1;
        padding: 0.5rem;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #2a2a2a;
        color: #e0e0e0;
      }

      input::placeholder {
        color: #9e9e9e;
      }

      button {
        padding: 0.5rem 1rem;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }

      button:disabled {
        background-color: #9e9e9e;
        cursor: not-allowed;
      }

      .url-list {
        list-style-type: none;
        padding: 0;
      }

      .url-list li {
        margin-bottom: 0.75rem;
      }

      .error {
        color: #ff5252;
        font-size: 0.875rem;
        margin-top: -0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>URL Shortener</h1>
      <p>
        by
        <a href="https://angelchavezportfolio.vercel.app/" target="_blank">
          Angel Chávez
        </a>
      </p>

      <form id="urlForm">
        <input
          type="url"
          id="urlInput"
          placeholder="Enter a valid URL"
          required
          aria-label="URL to shorten"
        />
        <button id="sendURL" type="submit">Save URL</button>
      </form>

      <div id="feedback" class="error" role="alert"></div>
      <ul id="urlList" class="url-list"></ul>

      <script>
        const urlForm = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        const feedback = document.getElementById('feedback');
        const urlList = document.getElementById('urlList');

        urlForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          feedback.textContent = ''; // Limpiar errores previos

          const url = urlInput.value.trim();
          if (!url) {
            feedback.textContent = 'Please enter a URL.';
            return;
          }

          try {
            const response = await fetch('/api/url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            });

            if (!response.ok) {
              throw new Error('Failed to save URL.');
            }

            const data = await response.json();
            displayShortenedURL(data);
            urlInput.value = ''; // Limpiar el campo
          } catch (error) {
            feedback.textContent = error.message;
          }
        });

        function displayShortenedURL({ shortened, expires }) {
          const expirationDate = new Date(expires).toLocaleDateString();
          const li = document.createElement('li');
          li.innerHTML = `
            Shortened URL: 
            <a href="/${shortened}" target="_blank" style="color: #45a049;">${shortened}</a> 
            (Expires: ${expirationDate})
          `;
          urlList.appendChild(li);
        }
      </script>
    </main>
  </body>
</html>
